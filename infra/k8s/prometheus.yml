apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: alertflow
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: "agent-service"
        static_configs:
          - targets: ["agent-service:8000"]
      - job_name: "analyzer-service"
        static_configs:
          - targets: ["analyzer-service:8000"]
      - job_name: "alert-service"
        static_configs:
          - targets: ["alert-service:8000"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: alertflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: alertflow
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090