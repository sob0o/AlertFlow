apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: alertflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
    spec:
      containers:
        - name: agent-service
          image: alertflow-agent-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: alertflow
spec:
  selector:
    app: agent-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP